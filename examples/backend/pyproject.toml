[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[project]
name = "multimodal-video-annotation-backend"
version = "0.1.0"
description = "FastAPI backend for the multimodal video annotation platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
