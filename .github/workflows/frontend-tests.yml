name: Frontend checks

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend JavaScript syntax
        run: |
          mapfile -d '' files < <(find frontend/src -type f -name '*.js' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript source files found under frontend/src; skipping syntax checks."
          else
            for file in "${files[@]}"; do
              node --check "$file"
            done
          fi

