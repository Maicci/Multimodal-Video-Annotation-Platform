name: Processing tests

on:
  push:
    paths:
      - "processing/**"
      - ".github/workflows/processing-tests.yml"
  pull_request:
    paths:
      - "processing/**"
      - ".github/workflows/processing-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Run processing tests
        run: |
          if python -m pytest processing/tests; then
            :
          else
            status=$?
            if [ "$status" -eq 5 ]; then
              echo "No tests collected; allowing the workflow to pass until tests are added."
            else
              exit "$status"
            fi
          fi
