name: Video workflow integration

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "test-space/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "test-space/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e-tests.yml"

jobs:
  video-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run browser workflow in Docker
        run: docker compose -f test-space/compose.yaml --profile e2e up --build --abort-on-container-exit --exit-code-from e2e e2e
      - name: Save browser reports and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-space/artifacts/
          if-no-files-found: warn
