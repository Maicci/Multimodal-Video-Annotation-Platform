name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Run backend tests
        run: |
          if python -m pytest backend/tests; then
            :
          else
            status=$?
            if [ "$status" -eq 5 ]; then
              echo "No tests collected; allowing the workflow to pass until tests are added."
            else
              exit "$status"
            fi
          fi
